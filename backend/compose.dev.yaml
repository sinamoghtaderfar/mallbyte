services:
  web:
    container_name: mallbyte_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      # Preserve existing local support files and other working-tree media.
      - ./private_media:/app/private_media

  celery_worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
    container_name: mallbyte_celery_worker
    env_file:
      - .env.docker
    command: celery -A config worker -l info
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mallbyte_backend
    profiles:
      - celery

  celery_beat:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
    container_name: mallbyte_celery_beat
    env_file:
      - .env.docker
    command: celery -A config beat -l info --scheduler apps.observability.beat_scheduler:SingletonDatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mallbyte_backend
    profiles:
      - celery

  mailpit:
    image: axllent/mailpit:latest
    container_name: mallbyte_mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - mallbyte_backend
    profiles:
      - tools

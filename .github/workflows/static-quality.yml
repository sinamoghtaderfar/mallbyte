name: Static quality

on:
  pull_request:
    paths:
      - 'backend/**/*.py'
      - 'backend/pyproject.toml'
      - '.gitattributes'
      - '.github/workflows/static-quality.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**/*.py'
      - 'backend/pyproject.toml'
      - '.gitattributes'
      - '.github/workflows/static-quality.yml'
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.15.5
      - name: Lint remediated content, observability and configuration
        run: ruff check apps/content apps/observability config
      - name: Parse backend Python sources
        run: python -m compileall -q apps config deploy ops

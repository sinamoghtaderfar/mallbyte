name: Frontend production image smoke

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.gitattributes'
      - '.github/workflows/frontend-image-ci.yml'
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: frontend

jobs:
  standalone-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate frontend staging compose
        env:
          NEXT_PUBLIC_API_BASE_URL: https://staging-api.example.com
        run: docker compose -f compose.staging.yaml config --quiet
      - name: Build non-root production image
        run: |
          docker build -f Dockerfile.production \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://staging-api.example.com \
            -t mallbyte-web:ci .
      - name: Check container starts as non-root user
        run: |
          test "$(docker image inspect mallbyte-web:ci --format '{{.Config.User}}')" = "nextjs"
          docker run -d --name mallbyte-web-smoke -p 127.0.0.1:3000:3000 mallbyte-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs mallbyte-web-smoke
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs mallbyte-web-smoke || true

name: Full-stack integration

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yaml'
      - '.env.example'
      - 'scripts/init-dev-env.py'
      - '.gitattributes'
      - '.github/workflows/monorepo-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yaml'
      - '.env.example'
      - 'scripts/init-dev-env.py'
      - '.gitattributes'
      - '.github/workflows/monorepo-ci.yml'
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and start the full local stack
        run: |
          python3 scripts/init-dev-env.py
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 240
      - name: Verify worker result delivery and the singleton beat schedule
        run: |
          test "$(docker compose ps --status running -q celery_beat | wc -l)" -eq 1
          docker compose exec -T web python manage.py shell <<'PY'
          import time
          from config.celery import debug_task
          from django_celery_beat.models import PeriodicTask

          result = debug_task.delay()
          result.get(timeout=45)
          assert result.successful(), result.state
          result.forget()

          deadline = time.monotonic() + 30
          schedule = PeriodicTask.objects.filter(name="expire-pending-order-reservations",
                                                 task="apps.orders.tasks.expire_pending_orders", enabled=True)
          while not schedule.exists():
              if time.monotonic() >= deadline:
                  raise AssertionError("Celery beat did not install the order reservation schedule")
              time.sleep(1)
          PY
      - name: Check browser-origin access and protected API
        run: |
          curl -fsS -D "$RUNNER_TEMP/api.headers" -o /dev/null -H 'Origin: http://localhost:3000' http://localhost:8000/api/products/products/
          tr -d '\r' < "$RUNNER_TEMP/api.headers" | grep -Fix 'access-control-allow-origin: http://localhost:3000'
          tr -d '\r' < "$RUNNER_TEMP/api.headers" | grep -Fix 'access-control-allow-credentials: true'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/api/auth/profile/)" = 401
      - name: Verify a Next.js server render backed by Django and PostgreSQL
        run: |
          docker compose exec -T web python manage.py shell -c \
            'from apps.content.models import ContentPage; ContentPage.objects.create(slug="ci-integration", title="Full stack CI", content="mallbyte-integration-proof", status="published")'
          curl -fsS --max-time 120 http://localhost:3000/pages/ci-integration -o "$RUNNER_TEMP/cms.html"
          grep -Fq 'mallbyte-integration-proof' "$RUNNER_TEMP/cms.html"
      - name: Show container state on failure
        if: failure()
        run: docker compose ps --all
      - name: Remove temporary containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

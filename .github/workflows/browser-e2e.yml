name: Browser E2E smoke checks

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.gitattributes'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: frontend

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # npm 10 can fail to add an ephemeral dependency into an existing
      # Next.js dependency tree. Install the browser runner separately.
      - name: Install isolated Playwright test runner
        run: |
          mkdir -p .playwright-runner
          npm install --prefix .playwright-runner --no-save @playwright/test@1.58.2
          ln -s ../.playwright-runner/node_modules/@playwright node_modules/@playwright
      # The hosted Ubuntu runner ships unrelated third-party APT sources.
      # Microsoft prod is not needed for Chromium and can return HTTP 403.
      # Disable only its dedicated source in this disposable runner; keep
      # Ubuntu sources and all package signature checks enabled.
      - name: Isolate Chromium dependency installation from Microsoft APT feed
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [[ -f "$source" ]] || continue
            if grep -Eq '^[[:space:]]*(deb[[:space:]]|URIs:).*https://packages\.microsoft\.com/ubuntu/24\.04/prod([/[:space:]]|$)' "$source"; then
              if grep -E '^[[:space:]]*(deb[[:space:]]|URIs:)' "$source" | grep -Evq 'https://packages\.microsoft\.com/ubuntu/24\.04/prod([/[:space:]]|$)'; then
                echo "::error::Refusing to disable mixed APT source $source"
                exit 1
              fi
              echo "Disabling unrelated Microsoft APT feed: $source"
              sudo mv -- "$source" "$source.disabled-for-playwright"
            fi
          done
      - name: Install Chromium and browser libraries
        run: .playwright-runner/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser tests with mocked APIs
        run: .playwright-runner/node_modules/.bin/playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

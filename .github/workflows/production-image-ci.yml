name: Production image smoke check

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.gitattributes'
      - '.github/workflows/production-image-ci.yml'
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: backend

jobs:
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build runtime image without development dependencies
        run: docker build -f Dockerfile.production -t mallbyte-api-production:test .
      - name: Generate ephemeral Django and MFA keys for checks
        run: |
          python -c 'import secrets; print("SECRET_KEY=" + secrets.token_urlsafe(64)); print("MFA_FERNET_KEY=" + secrets.token_urlsafe(32) + "=")' >> "$GITHUB_ENV"
      - name: Validate Django production configuration
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e SECRET_KEY \
            -e MFA_FERNET_KEY \
            -e ALLOWED_HOSTS=example.com \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e CACHE_BACKEND=redis \
            -e CACHE_REDIS_URL=redis://localhost:6379/1 \
            mallbyte-api-production:test python manage.py check --deploy

      - name: Assert production safeguards with development flags present
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e DEBUG=True \
            -e SETTLEMENTS_ALLOW_MOCK_SUCCESS=True \
            -e SETTLEMENTS_ALLOW_SIGNED_MOCK_EVENTS=True \
            -e SETTLEMENTS_DEMO_ENABLED=True \
            -e SECRET_KEY \
            -e MFA_FERNET_KEY \
            -e ALLOWED_HOSTS=example.com \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e CACHE_BACKEND=redis \
            -e CACHE_REDIS_URL=redis://localhost:6379/1 \
            mallbyte-api-production:test python -c '
          from django.conf import settings
          assert settings.AUTH_COOKIE_SECURE and settings.SESSION_COOKIE_SECURE and settings.CSRF_COOKIE_SECURE
          assert settings.DATABASES["default"]["OPTIONS"]["sslmode"] == "require"
          assert settings.SECURE_SSL_REDIRECT
          assert not (settings.DEBUG or settings.SETTLEMENTS_ALLOW_MOCK_SUCCESS or settings.SETTLEMENTS_ALLOW_SIGNED_MOCK_EVENTS or settings.SETTLEMENTS_DEMO_ENABLED)
          assert settings.CACHES["default"]["BACKEND"] == "django_redis.cache.RedisCache"
          '

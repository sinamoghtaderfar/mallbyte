name: Dependency security

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: backend

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install isolated security tooling and runtime requirements
        run: python -m pip install -r requirements/security.txt
      - name: Check runtime dependency compatibility
        run: python -m pip check
      - name: Audit declared runtime dependencies
        run: python -m pip_audit --strict --progress-spinner off -r requirements/production.txt

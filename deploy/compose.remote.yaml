# Used with backend/compose.staging.yaml or backend/compose.production.yaml.
# Relative paths resolve from the backend Compose project directory.
x-backend-image: &backend-image
  image: ${MALLBYTE_BACKEND_IMAGE:?Set the backend image tag or digest}
services:
  web:
    <<: *backend-image
  celery_worker:
    <<: *backend-image
  celery_beat:
    <<: *backend-image
  frontend:
    image: ${MALLBYTE_FRONTEND_IMAGE:?Set the frontend image tag or digest}
    build:
      context: ../frontend
      dockerfile: Dockerfile.production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set the public HTTPS API origin}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-${NEXT_PUBLIC_API_BASE_URL}}
      NEXT_TELEMETRY_DISABLED: "1"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/auth').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
